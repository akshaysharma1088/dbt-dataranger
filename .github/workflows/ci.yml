name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt: ["1.10.*", "1.11.*", "1.12.*"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "dbt-core==${{ matrix.dbt }}" dbt-duckdb
      - name: Build the integration project
        working-directory: integration_tests
        run: dbt deps && dbt build
